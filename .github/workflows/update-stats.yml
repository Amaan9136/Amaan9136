name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 6 * * *'   # Once a day at 06:00 UTC
  workflow_dispatch:      # Allow manual runs
  push:
    branches: [main]

# CRITICAL: Grant write permissions so the runner can push changes back to the repo
permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Amaan9136&show_icons=true&theme=tokyonight&hide_border=true&count_private=true
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages card (self-hosted, no external service dependency)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Amaan9136&layout=compact&theme=tokyonight&hide_border=true
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GitHub stats SVGs" && git push)