name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 6 * * *'   # Once a day at 06:00 UTC
  workflow_dispatch:      # Allow manual runs
  push:
    branches: [main]

# CRITICAL: Grant write permissions so the runner can push changes back to the repo
permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Generate stats card (to temp file)
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api?username=Amaan9136&show_icons=true&theme=tokyonight&hide_border=true&count_private=true" \
            -o /tmp/github-stats.svg

      - name: Generate top languages card (to temp file)
        run: |
          curl -sf "https://github-readme-stats.vercel.app/api/top-langs/?username=Amaan9136&layout=compact&theme=tokyonight&hide_border=true" \
            -o /tmp/top-langs.svg

      - name: Validate SVGs before overwriting committed copies
        run: |
          for f in /tmp/github-stats.svg /tmp/top-langs.svg; do
            if [ ! -s "$f" ] || ! grep -q "<svg" "$f"; then
              echo "::error::$f is empty or not a valid SVG (source service likely rate-limited or down) — keeping existing committed version."
              exit 1
            fi
          done
          # Ensure assets folder exists before copying
          mkdir -p assets
          cp /tmp/github-stats.svg assets/github-stats.svg
          cp /tmp/top-langs.svg assets/top-langs.svg

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-langs.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update GitHub stats SVGs" && git push)